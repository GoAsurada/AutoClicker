name: Validate AutoClicker

on:
  push:
    branches:
      - main
      - 'improve/**'
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q autoclicker gui_app.py main.py
      - name: Run regression suite
        run: python -m unittest discover -s . -p "test_*.py"

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build standalone executable
        run: pyinstaller --noconfirm AutoClicker.spec
      - name: Upload enhanced executable
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Enhanced-Windows
          path: dist/AutoClicker.exe
          if-no-files-found: error
          retention-days: 14
