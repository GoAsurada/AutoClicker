name: Validate AutoClicker

on:
  push:
    branches:
      - main
      - 'improve/**'
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q autoclicker gui_app.py main.py
      - name: Run regression suite
        run: python -m unittest discover -s . -p "test_*.py"

  build:
    if: github.event_name == 'push'
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Fetch official Pretendard 1.3.9 fonts
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Pretendard-1.3.9.zip'
          $extracted = Join-Path $env:RUNNER_TEMP 'pretendard-fonts'
          Invoke-WebRequest -Uri 'https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -Force
          New-Item -ItemType Directory -Force -Path 'assets/fonts' | Out-Null
          foreach ($weight in @('Regular', 'Bold')) {
            $filename = "Pretendard-$weight.otf"
            $font = Get-ChildItem -Path $extracted -Recurse -File -Filter $filename | Select-Object -First 1
            if (-not $font) { throw "Missing $filename in official Pretendard release" }
            Copy-Item -LiteralPath $font.FullName -Destination "assets/fonts/$filename"
          }
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/orioncactus/pretendard/v1.3.9/LICENSE' -OutFile 'assets/fonts/LICENSE-Pretendard.txt'
      - name: Build standalone executable
        run: pyinstaller --noconfirm AutoClicker.spec
      - name: Upload enhanced executable
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Enhanced-Windows
          path: dist/AutoClicker.exe
          if-no-files-found: error
          retention-days: 14
